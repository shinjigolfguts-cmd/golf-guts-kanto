name: 関東版・参照URL確認

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: read

concurrency:
  group: kanto-source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: ファイルを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 参照URLの接続を確認
        run: python3 scripts/check_sources.py

      - name: 結果を表示して要確認を判定
        if: always()
        run: python3 scripts/summarize_sources.py

      - name: 確認結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kanto-source-check
          path: reports/
          if-no-files-found: error
          retention-days: 30
