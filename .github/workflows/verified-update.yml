name: 関東版・確認済み情報を検証して公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates/*.json', 'scripts/apply_verified_updates.py', 'scripts/build_seo.py', 'scripts/publish_verified.py', '.github/workflows/verified-update.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: kanto-verified-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 公式根拠付き更新を適用
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          archive=pathlib.Path('applied_updates');archive.mkdir(exist_ok=True)
          for f in sorted(pathlib.Path('updates').glob('*.json')):
              subprocess.run(['python3','scripts/apply_verified_updates.py',str(f),'--apply'],check=True)
              if (archive/f.name).exists(): raise SystemExit('Duplicate batch name')
              f.rename(archive/f.name)
          PY
          python3 scripts/build_seo.py
      - name: 公開前検証
        run: |
          node tests/test_selection.cjs
          node --check data.js
          node --check finder.js
          python3 -m unittest discover -s tests -v
          python3 tests/check_seo.py
          git diff --check
      - name: 検証済みファイルを保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data.js sitemap.xml all-courses.html courses applied_updates
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified course evidence and refresh search pages'
            git push origin HEAD:main
          fi
      - name: Pages公開と反映確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_verified.py
