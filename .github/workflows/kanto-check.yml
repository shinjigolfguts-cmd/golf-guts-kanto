name: 関東版・動作確認

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開サイトに接続できるか確認
        run: |
          curl --fail --show-error --silent --location \
            --retry 2 --max-time 60 \
            --output /dev/null \
            https://shinjigolfguts-cmd.github.io/golf-guts-kanto/
          echo "関東版への接続に成功しました"
